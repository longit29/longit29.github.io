*{box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f0f4ff;min-height:100vh}
.card-hover{transition:all .25s ease}
.card-hover:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(0,0,0,.15)}
.quiz-opt{transition:all .2s;border:2px solid #e5e7eb;cursor:pointer;border-radius:12px;padding:12px 16px;margin:6px 0;background:#fff;text-align:left;width:100%}

.quiz-opt.missed{border-color:#f59e0b;background:#fffbeb}
.accordion-btn{transition:all .2s}
.progress{transition:width .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}
.timer-warn{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

      {id:"t2v2",title:"Chính tả – Viết đúng",icon:"✏️",
       content:[
         {h:"Phân biệt ch / tr",t:"ch: chim, chạy, chú, chợ, cha, che, chi... tr: trong, trên, trái, trăng, trẻ, tre... Mẹo: từ chỉ con vật, đồ vật thân thuộc thường dùng 'ch'. Từ chỉ vị trí, hướng thường dùng 'tr'."},
         {h:"Phân biệt s / x",t:"s: sách, sân, sao, sóng, sữa, sông... x: xe, xanh, xuân, xem, xinh, xấu... Mẹo: từ chỉ con vật thường dùng 's' (sâu, sói, sư tử). x đứng trước e,ê,i,iê: xe, xem, xi, xiên."},
         {h:"Phân biệt d / gi / r",t:"d: dài, dễ, dùng, dưới, dạy, dậy... gi: giải, giáo, giấy, gia, giới, giờ... r: rừng, rau, rộng, riêng, rõ, rất... Mẹo: gi + âm đầu không đứng trước oa, oe, uê, uâ."},
         {h:"Dấu câu cơ bản",t:"Dấu chấm (.): kết thúc câu kể. Dấu hỏi (?): câu hỏi. Dấu chấm than (!): câu cảm, câu cầu khiến. Dấu phẩy (,): ngăn cách các vế hoặc liệt kê."},
       ],
       tips:["Học thuộc các từ hay viết sai","Đọc to trước khi viết","Viết chính tả xong → đọc lại kiểm tra"],
       ex:[{q:"ch hay tr: ...ăng tròn",a:"trăng tròn"},{q:"s hay x: ...e đạp",a:"xe đạp"},{q:"d hay gi: ...ao thừa",a:"giao thừa"}]},
      {id:"t2v3",title:"Luyện từ và câu",icon:"🔤",
       content:[
         {h:"Từ chỉ sự vật (danh từ)",t:"Là từ gọi tên người, con vật, đồ vật, cây cối, hiện tượng. Ví dụ: bạn, mèo, sách, tre, mưa, trường, hoa... Danh từ thường đứng sau: một, hai, cái, con, chiếc, bông..."},
         {h:"Từ chỉ hoạt động (động từ)",t:"Là từ chỉ hành động, trạng thái. Ví dụ: chạy, nhảy, học, ăn, ngủ, đọc, viết, yêu, ghét... Động từ thường đứng sau: đang, sẽ, đã, chưa..."},
         {h:"Từ chỉ đặc điểm (tính từ)",t:"Là từ chỉ đặc điểm, tính chất, màu sắc. Ví dụ: đẹp, xấu, cao, thấp, nhanh, chậm, đỏ, xanh, vui, buồn... Thường đứng sau: rất, quá, lắm..."},
         {h:"Cấu trúc câu đơn",t:"Câu = Chủ ngữ (Ai/Cái gì?) + Vị ngữ (làm gì/là gì/thế nào?). Ví dụ: Bạn Nam / học bài. (CN: Bạn Nam; VN: học bài). Câu phải có nghĩa đầy đủ, bắt đầu bằng chữ hoa, có dấu câu cuối."},
       ],
       tips:["Danh từ → đứng sau 'một, cái, con, chiếc'","Động từ → đứng sau 'đang, sẽ, đã'","Tính từ → đứng sau 'rất, quá, lắm'"],
       ex:[{q:"Từ nào là danh từ: chạy, học sinh, đẹp?",a:"học sinh"},{q:"Từ nào là động từ: bàn, viết, xanh?",a:"viết"},{q:"Tìm CN và VN: 'Mưa rơi tí tách.'",a:"CN: Mưa | VN: rơi tí tách"}]},
      {id:"t2v4",title:"Tập làm văn – Viết câu, đoạn",icon:"📝",
       content:[
         {h:"Viết câu hoàn chỉnh",t:"Câu phải đủ nghĩa: có chủ ngữ + vị ngữ. Bắt đầu bằng chữ hoa. Kết thúc bằng dấu câu phù hợp. Ví dụ SAI: 'đang học bài'. Ví dụ ĐÚNG: 'Bạn Lan đang học bài.'"},
         {h:"Mở rộng câu",t:"Thêm thời gian, địa điểm, cách thức để câu sinh động hơn. Gốc: 'Bạn đọc sách.' → Mở rộng: 'Sáng nay, bạn Mai đọc sách trong thư viện một cách chăm chú.'"},
         {h:"Viết đoạn văn ngắn (3–5 câu)",t:"Câu 1 – Mở đầu: Giới thiệu chủ đề. Câu 2,3 – Thân: Miêu tả, kể chi tiết. Câu cuối – Kết: Nêu cảm nghĩ. Ví dụ về con mèo: 'Nhà em có nuôi một con mèo. Nó có bộ lông trắng mịn và đôi mắt to tròn. Em rất yêu con mèo nhà em.'"},
       ],
       tips:["Câu phải có đủ chủ ngữ và vị ngữ","Dùng từ gợi tả để câu sinh động hơn","Đoạn văn: câu đầu lùi vào, chữ hoa"],

       tips:["Đọc câu hỏi trước, đọc bài có trọng tâm","Gạch chân từ/câu trả lời câu hỏi","Nhận xét nhân vật dựa vào hành động cụ thể"],
       ex:[{q:"Câu 'Mặt trăng tròn như cái đĩa' sử dụng biện pháp gì?",a:"So sánh"},{q:"Ý chính thường nằm ở đâu trong đoạn?",a:"Câu đầu hoặc câu cuối đoạn"}]},
      {id:"t3v2",title:"Từ ghép và Từ láy",icon:"🔤",
       content:[
         {h:"Từ ghép",t:"Từ ghép: gồm 2 tiếng trở lên có nghĩa riêng, ghép lại tạo nghĩa mới. Từ ghép phân loại: hoa hồng, xe đạp, học sinh, bàn ghế. Từ ghép tổng hợp: quần áo, sách vở, đi lại (các tiếng cùng loại)."},
         {h:"Từ láy",t:"Từ láy: lặp lại âm hoặc vần. Láy hoàn toàn: xanh xanh, đỏ đỏ. Láy phụ âm đầu: lung linh, lấp lánh, bập bềnh. Láy vần: lao xao, dào dạt, lảo đảo. Từ láy thường gợi âm thanh hoặc hình ảnh."},
         {h:"Phân biệt từ ghép và từ láy",t:"Từ láy: các tiếng lặp âm/vần, tách ra thường không có nghĩa (lung, linh). Từ ghép: các tiếng đều có nghĩa (hoa + hồng). Lưu ý: 'đất đai' là từ ghép tuy nghe như láy."},
       ],
       tips:["Tách tiếng: nếu từng tiếng có nghĩa → từ ghép","Nếu lặp âm/vần → từ láy","Từ láy thường giàu âm điệu, gợi cảm xúc"],
       ex:[{q:"'Lung linh' là từ ghép hay từ láy?",a:"Từ láy (láy phụ âm đầu l)"},{q:"'Học sinh' là từ ghép hay từ láy?",a:"Từ ghép (học có nghĩa + sinh có nghĩa)"},{q:"Tìm từ láy trong: xanh tươi, xanh xao, xanh ngắt",a:"xanh xao (láy phụ âm đầu x)"}]},
      {id:"t3v3",title:"Câu kể – Ai làm gì? Ai là gì? Ai thế nào?",icon:"💬",
       content:[
         {h:"Câu kể 'Ai làm gì?'",t:"Chủ ngữ (Ai?) + Vị ngữ (làm gì?). Vị ngữ là động từ hoặc cụm động từ. Ví dụ: Bạn Hoa / đang đọc sách. (Bạn Hoa = CN; đang đọc sách = VN). Hỏi: 'Bạn Hoa làm gì?' → Đọc sách."},
         {h:"Câu kể 'Ai là gì?'",t:"Chủ ngữ (Ai?) + Vị ngữ (là gì?). Vị ngữ thường có từ 'là'. Ví dụ: Bố em / là bác sĩ. (Bố em = CN; là bác sĩ = VN). Hỏi: 'Bố em là gì?' → Là bác sĩ."},
         {h:"Câu kể 'Ai thế nào?'",t:"Chủ ngữ (Ai/Cái gì?) + Vị ngữ (thế nào?). Vị ngữ là tính từ hoặc cụm tính từ. Ví dụ: Bầu trời / thật xanh trong. (Bầu trời = CN; thật xanh trong = VN). Hỏi: 'Bầu trời thế nào?' → Xanh trong."},
       ],
       tips:["Câu 'Ai làm gì?' → VN là động từ","Câu 'Ai là gì?' → VN có từ 'là'","Câu 'Ai thế nào?' → VN là tính từ"],
       ex:[{q:"'Cô giáo giảng bài.' – loại câu?",a:"Câu kể 'Ai làm gì?' (CN: Cô giáo; VN: giảng bài)"},{q:"'Mặt trời đỏ rực.' – loại câu?",a:"Câu kể 'Ai thế nào?' (CN: Mặt trời; VN: đỏ rực)"},{q:"'Hà Nội là thủ đô.' – loại câu?",a:"Câu kể 'Ai là gì?' (CN: Hà Nội; VN: là thủ đô)"}]},
      {id:"t3v4",title:"Viết đoạn văn",icon:"📝",
       content:[
         {h:"Cấu trúc đoạn văn",t:"Đoạn văn gồm 3 phần: Mở đầu (giới thiệu), Thân đoạn (chi tiết, miêu tả, kể), Kết (cảm nghĩ, đánh giá). Khoảng 4–7 câu cho lớp 3."},
         {h:"Đoạn văn kể về con vật",t:"M: Giới thiệu con vật. T: Hình dáng (màu lông, kích thước), tính cách, hoạt động thú vị. K: Tình cảm của em với con vật. Dùng từ gợi tả, hình ảnh so sánh."},
         {h:"Đoạn văn miêu tả cây cối",t:"M: Giới thiệu cây. T: Thân cây, lá, hoa/quả, mùi hương. K: Ý nghĩa, cảm xúc. Ví dụ: 'Cây phượng sừng sững giữa sân trường. Những chùm hoa đỏ rực như ngọn lửa...'"},
       ],
       tips:["Dùng từ so sánh để câu văn sinh động hơn","Mỗi đoạn chỉ nói về 1 ý chính","Đọc lại sau khi viết để sửa lỗi"],
       ex:[{q:"Câu đầu đoạn văn dùng để làm gì?",a:"Giới thiệu chủ đề của đoạn"},{q:"Làm sao câu văn sinh động hơn?",a:"Dùng từ so sánh, từ láy, từ gợi tả"}]},
    ],

  vietnamese:{
    label:"Tiếng Việt",color:"from-purple-400 to-pink-400",icon:"📖",
    theory:[
      {id:"t4v1",title:"Văn kể chuyện và Miêu tả",icon:"📚",
       content:[
         {h:"Văn kể chuyện",t:"Văn kể chuyện: kể lại sự việc có diễn biến theo thời gian. Cấu trúc: Mở bài (giới thiệu hoàn cảnh, nhân vật) → Thân bài (diễn biến sự việc) → Kết bài (kết thúc, bài học). Nhân vật có lời nói, hành động, suy nghĩ cụ thể."},
         {h:"Văn miêu tả",t:"Văn miêu tả: tái hiện sự vật, cảnh vật, con người bằng ngôn ngữ. Miêu tả theo trình tự: từ xa đến gần, từ ngoài vào trong, từ trên xuống dưới. Dùng từ ngữ gợi tả, biện pháp tu từ (so sánh, nhân hóa)."},
         {h:"Mở bài trực tiếp và gián tiếp",t:"Trực tiếp: vào thẳng vào đề. 'Mỗi sáng, tôi thường ra vườn ngắm hoa.' Gián tiếp: dẫn dắt vào đề bằng ý liên quan. 'Mùa xuân về, muôn hoa đua nở. Trong vườn nhà em, đẹp nhất là cây hoa mai.'"},
       ],
       tips:["Văn kể: nhớ trình tự sự việc (trước → sau)","Văn miêu tả: chú ý từ gợi tả (màu sắc, hình dáng, âm thanh, mùi hương)","Kết bài cần nêu cảm nghĩ, bài học"],
       ex:[{q:"Mở bài gián tiếp khác trực tiếp ở điểm nào?",a:"Gián tiếp dẫn dắt từ ý khác rồi mới vào chủ đề"},{q:"Văn kể chuyện cần có gì?",a:"Nhân vật, diễn biến sự việc theo thời gian, kết thúc"}]},
      {id:"t4v2",title:"Danh từ, Động từ, Tính từ – Nâng cao",icon:"🔤",
       content:[
         {h:"Danh từ chung và danh từ riêng",t:"Danh từ chung: gọi chung cho loại (sông, núi, thành phố). Danh từ riêng: tên riêng, viết hoa (sông Hồng, núi Bà Đen, thành phố Hà Nội). Danh từ riêng chỉ người, địa danh, tổ chức."},
         {h:"Động từ và cụm động từ",t:"Động từ chỉ hành động (chạy, học, ăn) hoặc trạng thái (ngủ, thức, tồn tại). Cụm động từ: động từ + các từ bổ sung nghĩa. 'Đang học bài' = đang (phụ trước) + học (ĐT chính) + bài (phụ sau)."},
         {h:"Tính từ và cụm tính từ",t:"Tính từ chỉ đặc điểm, tính chất, trạng thái. Cụm tính từ: 'rất đẹp', 'cao lắm', 'xanh mướt'. Tính từ so sánh: đẹp hơn, đẹp nhất, đẹp như..."},
       ],
       tips:["Danh từ riêng luôn viết hoa","Động từ trạng thái: yêu, ghét, sợ, biết... (không hành động thể hiện ra ngoài)","Tính từ có thể thêm 'rất, quá, lắm' phía trước/sau"],
       ex:[{q:"'Sông Mekong' là danh từ chung hay riêng?",a:"Danh từ riêng (tên riêng của dòng sông)"},{q:"'Đang chạy nhanh' là cụm gì?",a:"Cụm động từ (đang=phụ trước; chạy=ĐT; nhanh=phụ sau)"}]},
      {id:"t4v3",title:"Câu đơn và Câu ghép",icon:"💬",
       content:[
         {h:"Câu đơn",t:"Câu đơn: có một cụm chủ ngữ - vị ngữ. Ví dụ: 'Chim hót líu lo.' (CN: Chim; VN: hót líu lo). Câu đơn đầy đủ: có đủ CN và VN; Câu đặc biệt: thiếu CN hoặc VN (dùng trong văn)."},
         {h:"Câu ghép",t:"Câu ghép: có 2 cụm CN-VN trở lên. Nối bằng: quan hệ từ (vì...nên, nếu...thì, tuy...nhưng, và, nhưng, hoặc), dấu phẩy. VD: 'Trời mưa to, nhưng chúng em vẫn đến trường.'"},
         {h:"Quan hệ từ trong câu ghép",t:"Nguyên nhân-kết quả: vì...nên, do...nên. Điều kiện-kết quả: nếu...thì. Tương phản: tuy...nhưng, mặc dù...nhưng. Bổ sung: và, thêm vào đó. Lựa chọn: hoặc, hay."},
       ],
       tips:["Câu đơn: 1 CN + 1 VN","Câu ghép: ≥ 2 cụm CN-VN","Tìm quan hệ từ để nhận biết câu ghép"],
       ex:[{q:"'Mưa to và gió mạnh.' – câu đơn hay ghép?",a:"Câu ghép (2 VN: mưa to / gió mạnh, nối bằng 'và')"},{q:"Điền quan hệ từ: '... mệt, em vẫn học bài.'",a:"Tuy (mệt), nhưng (em vẫn học bài) → Tuy...nhưng"}]},
      {id:"t4v4",title:"Viết đoạn văn hoàn chỉnh",icon:"📝",
       content:[
         {h:"Cấu trúc bài văn hoàn chỉnh",t:"Mở bài → Thân bài (nhiều đoạn) → Kết bài. Mỗi đoạn thân bài: câu chủ đề + câu triển khai + câu kết đoạn. Các đoạn liên kết với nhau bằng từ nối (tiếp theo, hơn nữa, cuối cùng...)."},
         {h:"Liên kết câu và đoạn",t:"Lặp từ ngữ: dùng lại từ đã dùng ở câu trước. Dùng đại từ: thay 'bạn Nam' bằng 'cậu ấy', 'em ấy'. Dùng từ nối: và, nhưng, vì vậy, do đó, mặt khác, ngoài ra..."},
         {h:"Dấu câu nâng cao",t:"Dấu hai chấm (:): báo hiệu lời dẫn trực tiếp hoặc liệt kê. Dấu ngoặc kép (\"\") trích lời nói. Dấu gạch ngang (—): đánh dấu lời thoại trực tiếp. Dấu chấm lửng (...): bỏ lửng, tạo ngừng."},
       ],
       tips:["Liên kết câu tránh lặp từ nhàm chán (dùng đại từ thay thế)","Mỗi đoạn văn chỉ có 1 ý chính","Câu đầu và câu cuối đoạn phải liên quan chặt chẽ"],
       ex:[{q:"Từ nối nào thể hiện quan hệ tương phản?",a:"Nhưng, tuy nhiên, mặc dù, song"},{q:"Dấu câu nào dùng khi trích lời nói?",a:"Dấu ngoặc kép (\"\") và dấu hai chấm (:)"}]},

const CURRICULUM = {

// ================================================================

// ================================================================
function Navbar({page, grade, subject, goBack, nav}) {
  const gradeData = grade ? CURRICULUM[grade] : null;
  const subjectData = (grade && subject) ? CURRICULUM[grade][subject] : null;
  const showBack = page !== 'home';
  return (
    <nav className="bg-white shadow-md sticky top-0 z-50">
      <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-3">
          {showBack && (
            <button onClick={goBack} className="text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1 text-sm">
              ← Quay lại
            </button>
          )}
          <button onClick={()=>nav('home')} className="font-bold text-lg text-indigo-700 flex items-center gap-2">
            🌈 Học Tốt Tiểu Học
          </button>
        </div>
        {gradeData && (
          <div className="flex items-center gap-2 text-sm text-gray-500">
            <span className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-semibold">{gradeData.label}</span>
            {subjectData && <span className="bg-pink-100 text-pink-700 px-2 py-1 rounded-full font-semibold">{subjectData.label}</span>}
          </div>
        )}
      </div>
    </nav>
  );
}

              <div className="text-sm opacity-90 mt-1">{t.desc}</div>
            </div>
            <span className="ml-auto text-3xl opacity-70">›</span>
          </button>
        ))}
      </div>
    </div>
  );

// ================================================================
// EXERCISE PAGE – list + quiz
// ================================================================
function ExercisePage({grade, subject, nav}) {
  const sub = CURRICULUM[grade][subject];
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);

  const startExercise = (ex) => {
    setSelected(ex);
    setAnswers({});
    setSubmitted(false);
    window.scrollTo(0,0);
  };

  if (!selected) {
    return (
      <div className="fade-up max-w-xl mx-auto px-4 py-8">
        <div className="text-center mb-8">
          <span className="text-4xl">✏️</span>
          <h2 className="text-2xl font-extrabold text-gray-800 mt-2">Bài tập – {sub.label}</h2>
          <p className="text-gray-500 text-sm mt-1">{CURRICULUM[grade].label} · Chọn bộ bài tập</p>
        </div>
        <div className="space-y-4">
          {sub.exercises.map(ex=>(
            <button key={ex.id} onClick={()=>startExercise(ex)}
              className="card-hover w-full bg-white rounded-2xl p-5 shadow flex items-center gap-4 text-left">
              <span className="text-3xl">{ex.icon}</span>
              <div className="flex-1">
                <div className="font-bold text-gray-800">{ex.title}</div>
                <div className="text-sm text-gray-500 mt-1">{ex.qs.length} câu · {ex.diff}</div>
              </div>
              <span className="bg-indigo-100 text-indigo-700 rounded-full px-3 py-1 text-sm font-semibold">Làm bài →</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  const score = submitted ? selected.qs.filter((q,i)=>answers[i]===q.a).length : 0;
  const total = selected.qs.length;
  const pct = submitted ? Math.round(score/total*100) : 0;

  return (
    <div className="fade-up max-w-2xl mx-auto px-4 py-8">
      <div className="bg-white rounded-2xl shadow p-5 mb-6">
        <div className="flex items-center gap-3 mb-1">
          <span className="text-2xl">{selected.icon}</span>
          <h3 className="font-extrabold text-xl text-gray-800">{selected.title}</h3>
        </div>
        <p className="text-sm text-gray-500">{total} câu · {selected.diff}</p>
        {submitted && (
          <div className="mt-4 p-4 rounded-xl bg-gradient-to-r from-indigo-50 to-purple-50 flex items-center gap-4">
            <ScoreCircle score={score} total={total}/>
            <div>
              <div className="text-2xl font-extrabold text-indigo-700">{score}/{total} câu đúng</div>
              <div className="text-lg font-bold text-gray-700">{pct}% · {getRank(score,total)}</div>
              <button onClick={()=>{setAnswers({});setSubmitted(false);}} className="mt-2 text-sm text-indigo-600 underline">Làm lại</button>
              <button onClick={()=>setSelected(null)} className="mt-2 ml-4 text-sm text-gray-500 underline">Chọn bộ khác</button>
            </div>
          </div>
        )}
      </div>

      <div className="space-y-5">
        {selected.qs.map((q,i)=>{
          const ans = answers[i];
          const done = ans !== undefined;
          const correct = done && ans === q.a;
          return (
            <div key={i} className="bg-white rounded-2xl shadow p-5">
              <div className="font-semibold text-gray-800 mb-3">
                <span className="text-indigo-600 font-bold mr-2">Câu {i+1}.</span>{q.q}
              </div>
              <div className="space-y-2">
                {q.o.map((opt,j)=>{
                  let cls = 'quiz-opt';
                  if(done || submitted) {
                    cls += ' done';
                    if(j===q.a) cls += ' correct';
                    else if(j===ans && ans!==q.a) cls += ' wrong';
                  }
                  return (
                    <button key={j} className={cls}
                      onClick={()=>{if(!done && !submitted){setAnswers(prev=>({...prev,[i]:j}));}}}>
                      <span className="font-semibold text-gray-500 mr-2">{['A','B','C','D'][j]}.</span>
                      {opt}
                      {(done||submitted) && j===q.a && <span className="ml-2 text-green-600">✓</span>}
                      {(done||submitted) && j===ans && ans!==q.a && <span className="ml-2 text-red-500">✗</span>}
                    </button>
                  );
                })}
              </div>
              {(done || submitted) && (
                <div className="mt-3 text-sm bg-blue-50 rounded-xl p-3 text-blue-800">
                  💡 <strong>Giải thích:</strong> {q.e}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {!submitted && Object.keys(answers).length === total && (
        <div className="mt-6 text-center">
          <button onClick={()=>{setSubmitted(true);window.scrollTo(0,0);}}
            className="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-4 px-10 rounded-2xl text-lg shadow-lg hover:opacity-90 transition">
            🎯 Nộp bài &amp; xem điểm
          </button>
        </div>
      )}
      {!submitted && Object.keys(answers).length < total && (
        <div className="mt-4 text-center text-sm text-gray-500">
          Đã trả lời {Object.keys(answers).length}/{total} câu
        </div>
      )}
    </div>
  );
}

// ================================================================
// EXAM PAGE – timed exam
// ================================================================
function ExamPage({grade, subject, nav}) {
  const sub = CURRICULUM[grade][subject];
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [timeLeft, setTimeLeft] = useState(0);
  const timerRef = useRef(null);

  const startExam = (exam) => {
    setSelected(exam);
    setAnswers({});
    setSubmitted(false);
    setTimeLeft(exam.dur * 60);
    window.scrollTo(0,0);
  };

  useEffect(()=>{
    if(selected && !submitted && timeLeft > 0) {
      timerRef.current = setInterval(()=>{
        setTimeLeft(t => {
          if(t <= 1) { clearInterval(timerRef.current); setSubmitted(true); return 0; }
          return t - 1;
        });
      }, 1000);
    }
    return ()=>clearInterval(timerRef.current);
  }, [selected, submitted]);

  const submitExam = () => {
    clearInterval(timerRef.current);
    setSubmitted(true);
    window.scrollTo(0,0);
  };

  if(!selected) {
    const semGroups = {HK1:[], HK2:[]};
    sub.exams.forEach(e => semGroups[e.sem]?.push(e));
    return (
      <div className="fade-up max-w-xl mx-auto px-4 py-8">
        <div className="text-center mb-8">
          <span className="text-4xl">🏆</span>
          <h2 className="text-2xl font-extrabold text-gray-800 mt-2">Đề thi – {sub.label}</h2>
          <p className="text-gray-500 text-sm mt-1">{CURRICULUM[grade].label} · Chọn đề thi</p>
        </div>
        {['HK1','HK2'].map(sem=>(
          <div key={sem} className="mb-6">
            <div className="font-bold text-gray-600 mb-3 text-sm uppercase tracking-wide">📅 Học kỳ {sem==='HK1'?'1':'2'}</div>
            <div className="space-y-3">
              {semGroups[sem].map(exam=>(
                <button key={exam.id} onClick={()=>startExam(exam)}
                  className="card-hover w-full bg-white rounded-2xl p-5 shadow flex items-center gap-4 text-left">
                  <span className="text-3xl">{exam.title.includes('Giữa')?'📝':'📋'}</span>
                  <div className="flex-1">
                    <div className="font-bold text-gray-800">{exam.title}</div>
                    <div className="text-sm text-gray-500 mt-1">{exam.qs.length} câu · {exam.dur} phút · {exam.totalScore||10} điểm</div>
                  </div>
                  <span className="bg-orange-100 text-orange-700 rounded-full px-3 py-1 text-sm font-semibold">Thi →</span>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  }

  const mm = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const ss = String(timeLeft%60).padStart(2,'0');
  const isWarn = timeLeft < 300;
  const score = submitted ? selected.qs.filter((q,i)=>answers[i]===q.a).length : 0;
  const total = selected.qs.length;

  return (
    <div className="fade-up max-w-2xl mx-auto px-4 py-8">
      {/* Header */}
      <div className="bg-white rounded-2xl shadow p-5 mb-6 sticky top-16 z-40">
        <div className="flex items-center justify-between">
          <div>
            <h3 className="font-extrabold text-lg text-gray-800">{selected.title}</h3>
            <p className="text-sm text-gray-500">{total} câu · {selected.dur} phút</p>
          </div>
          {!submitted && (
            <div className={`text-2xl font-extrabold font-mono ${isWarn?'timer-warn text-red-500':'text-indigo-700'}`}>
              ⏱ {mm}:{ss}
            </div>
          )}
          {submitted && (
            <div className="text-right">
              <div className="text-2xl font-extrabold text-indigo-700">{score}/{total}</div>
              <div className="text-sm text-gray-500">{getRank(score,total)}</div>
            </div>
          )}
        </div>
        {submitted && (
          <div className="mt-4 flex gap-3 flex-wrap">
            <ScoreCircle score={score} total={total}/>
            <div className="flex flex-col justify-center">
              <div className="text-xl font-extrabold text-indigo-700">{score}/{total} câu đúng · {Math.round(score/total*10)}/10 điểm</div>
              <div className="text-base font-bold text-gray-700">{getStars(score,total)} · {getRank(score,total)}</div>
              <div className="flex gap-2 mt-2">
                <button onClick={()=>startExam(selected)} className="text-sm bg-indigo-100 text-indigo-700 rounded-lg px-3 py-1 font-semibold">Thi lại</button>
                <button onClick={()=>setSelected(null)} className="text-sm bg-gray-100 text-gray-600 rounded-lg px-3 py-1 font-semibold">Chọn đề khác</button>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Passage (if any) */}
      {selected.passage && (
        <div className="bg-amber-50 border-l-4 border-amber-400 rounded-xl p-5 mb-6 text-sm text-gray-700 whitespace-pre-line leading-relaxed">
          {selected.passage}
        </div>
      )}

      {/* Questions */}
      <div className="space-y-5">
        {selected.qs.map((q,i)=>{
          const ans = answers[i];
          const done = ans !== undefined;
          return (
            <div key={i} className="bg-white rounded-2xl shadow p-5">
              <div className="font-semibold text-gray-800 mb-3">
                <span className="text-indigo-600 font-bold mr-2">Câu {i+1}.</span>{q.q}
              </div>
              <div className="space-y-2">
                {q.o.map((opt,j)=>{
                  let cls = 'quiz-opt';
                  if(submitted) {
                    cls += ' done';
                    if(j===q.a) cls += ' correct';
                    else if(j===ans && ans!==q.a) cls += ' wrong';
                  } else if(done) {
                    if(j===ans) cls += ' selected';
                  }
                  return (
                    <button key={j} className={cls}
                      onClick={()=>{if(!submitted){setAnswers(p=>({...p,[i]:j}));}}}>
                      <span className="font-semibold text-gray-500 mr-2">{['A','B','C','D'][j]}.</span>
                      {opt}
                      {submitted && j===q.a && <span className="ml-2 text-green-600 font-bold">✓</span>}
                      {submitted && j===ans && ans!==q.a && <span className="ml-2 text-red-500 font-bold">✗</span>}
                    </button>
                  );
                })}
              </div>
              {submitted && (
                <div className="mt-3 text-sm bg-blue-50 rounded-xl p-3 text-blue-800">
                  💡 <strong>Giải thích:</strong> {q.e}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {!submitted && (
        <div className="mt-8 text-center space-y-2">
          <div className="text-sm text-gray-500 mb-3">
            Đã trả lời {Object.keys(answers).length}/{total} câu
          </div>
          <button onClick={submitExam}
            className="bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-4 px-10 rounded-2xl text-lg shadow-lg hover:opacity-90 transition">
            🏆 Nộp bài thi
          </button>
        </div>
      )}
    </div>
  );
}

// ================================================================
// HELPERS
// ================================================================
function ScoreCircle({score, total}) {
  const pct = Math.round(score/total*100);
  const color = pct>=80?'#22c55e':pct>=60?'#f59e0b':'#ef4444';
  return (
    <div style={{width:70,height:70,borderRadius:'50%',background:`conic-gradient(${color} ${pct}%, #e5e7eb ${pct}%)`,
      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      <div style={{width:54,height:54,borderRadius:'50%',background:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <span style={{fontWeight:'800',fontSize:16,color}}>{pct}%</span>
      </div>
    </div>
  );
}

function getRank(score, total) {
  const p = score/total;
  if(p===1) return '🥇 Xuất sắc!';
  if(p>=0.8) return '🥈 Giỏi';
  if(p>=0.6) return '🥉 Khá';
  if(p>=0.4) return '📚 Trung bình';
  return '💪 Cần cố gắng thêm';
}

function getStars(score, total) {
  const p = score/total;
  if(p===1) return '⭐⭐⭐';
  if(p>=0.7) return '⭐⭐';
  return '⭐';
}

// ================================================================
// APP (main router)
// ================================================================
function App() {
  const [page, setPage] = useState('home');
  const [grade, setGrade] = useState(null);
  const [subject, setSubject] = useState(null);

  const nav = (p, opts={}) => {
    setPage(p);
    if(opts.grade !== undefined) setGrade(opts.grade);
    if(opts.subject !== undefined) setSubject(opts.subject);
    window.scrollTo(0,0);
  };

  const goBack = () => {
    if(page==='subject') nav('home');
    else if(page==='content') nav('subject',{grade,subject:null});
    else if(page==='theory'||page==='exercise'||page==='exam') nav('content',{grade,subject});
    else nav('home');
  };

  return (
    <div className="min-h-screen bg-gray-50">
      <Navbar page={page} grade={grade} subject={subject} goBack={goBack} nav={nav}/>
      {page==='home' && <HomePage nav={nav}/>}
      {page==='subject' && <SubjectPage grade={grade} nav={nav}/>}
      {page==='content' && <ContentPage grade={grade} subject={subject} nav={nav}/>}
      {page==='theory' && <TheoryPage grade={grade} subject={subject} nav={nav}/>}
      {page==='exercise' && <ExercisePage grade={grade} subject={subject} nav={nav}/>}
      {page==='exam' && <ExamPage grade={grade} subject={subject} nav={nav}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
